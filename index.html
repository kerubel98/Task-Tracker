<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <script src="/src/main.js" rel="js"></script>
    <title>task-tracker</title>
  </head>
  <body class="w-full h-screen flex justify-center items-center p-12">
  
    <div class="border-2 p-8 border-gray-900 h-full w-full rounded-2xl flex flex-col">
      <div class="w-full mx-auto">
        <div class="mb-5 w-full px-14">
          <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Task Tacker</label>
          <input type="text" id="task"
            class="bg-gray-50 border relative border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-4 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            placeholder="start wrighting and presse enter" required />
            <button onclick="addTask()" class="absolute end-38 top-29 bg-black text-white p-2 rounded-lg">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="m7.49 12-3.75 3.75m0 0 3.75 3.75m-3.75-3.75h16.5V4.499" />
              </svg>
            </button>
        </div>
      </div>
      <div class="px-18 flex flex-col w-full mt-8" id="check-Box">
        
      </div>
    </div>

  
  </body>
</html>
